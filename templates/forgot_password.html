{% extends "auth_base.html" %}

{% block title %}找回密码 - MovieRec{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-circle circle-one"></div>
    <div class="auth-circle circle-two"></div>

    <div class="register-container">
        <div class="register-form-box">
            <div class="auth-title">
                <h2>🔐 找回密码</h2>
                <p>验证安全问题后即可设置新密码</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="post">
                <div class="auth-field">
                    <label>用户名</label>
                    <input type="text" name="username" placeholder="请输入注册用户名" required>
                </div>

                <div class="auth-field">
                    <label>安全问题</label>
                    <div class="security-question">🎬 你最喜欢的一部电影是什么？</div>
                </div>

                <div class="auth-field">
                    <label>安全答案</label>
                    <input type="text" name="security_answer" placeholder="请输入注册时填写的答案" required>
                </div>

                <div class="auth-field">
                    <label>新密码</label>
                    <input type="password" name="password" placeholder="请输入新密码（至少 6 位）" required autocomplete="new-password">
                </div>

                <div class="auth-field">
                    <label>确认新密码</label>
                    <input type="password" name="confirm_password" placeholder="请再次输入新密码" required autocomplete="new-password">
                </div>

                <button type="submit" class="auth-main-button">重置密码</button>
            </form>

            <div class="auth-switch">
                想起密码了？<a href="/login">返回登录</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
