{% extends "auth_base.html" %}

{% block title %}用户注册 - MovieRec{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-circle circle-one"></div>
    <div class="auth-circle circle-two"></div>

    <div class="register-container">
        <div class="register-form-box">
            <div class="auth-title">
                <h2>创建账户 ✨</h2>
                <p>注册后即可使用完整电影推荐服务</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post">
                <div class="auth-field">
                    <label>用户名</label>
                    <input type="text" name="username" placeholder="请输入用户名（至少 3 个字符）" required autocomplete="username">
                </div>

                <div class="auth-field">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="请输入密码（至少 6 位）" required autocomplete="new-password">
                </div>

                <div class="auth-field">
                    <label>确认密码</label>
                    <input type="password" name="confirm_password" placeholder="请再次输入密码" required autocomplete="new-password">
                </div>

                <div class="auth-field">
                    <label>安全问题</label>
                    <div class="security-question">🎬 你最喜欢的一部电影是什么？</div>
                </div>

                <div class="auth-field">
                    <label>安全答案</label>
                    <input type="text" name="security_answer" placeholder="请输入答案，用于找回密码" required>
                </div>

                <button type="submit" class="auth-main-button">提交注册</button>
            </form>

            <div class="auth-switch">
                已经拥有账户？<a href="/login">立即登录</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
